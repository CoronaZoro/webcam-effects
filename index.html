<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webcam Effects</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body data-mode="fog">
    <main id="stage">
      <!-- Hidden <video> receives the webcam stream; we copy each frame onto the canvas. -->
      <video id="video" playsinline muted hidden></video>
      <canvas id="canvas"></canvas>

      <!-- Start / error card. Shown until the camera is running. -->
      <section id="card" class="card">
        <h1>Webcam Effects</h1>
        <p id="card-text">Camera and microphone stay in your browser. Nothing is uploaded.</p>
        <button id="start-btn" type="button">Start camera</button>
      </section>

      <!-- Mode switcher (top centre). Keys 1 / 2 do the same thing. -->
      <nav id="modebar" class="modebar hidden" aria-label="Effect mode">
        <button class="mode active" type="button" data-mode="fog"><kbd>1</kbd> Fog</button>
        <button class="mode" type="button" data-mode="vanish"><kbd>2</kbd> Vanish</button>
      </nav>

      <!-- Heads-up display (bottom left, shown once the camera is running). -->
      <aside id="hud" class="hud hidden">
        <label class="hud-row">
          <span>Audio triggers <kbd>A</kbd></span>
          <input id="audio-triggers" type="checkbox" checked />
        </label>

        <div class="only-fog meter" title="Low-frequency mic level. The tick is the blow threshold.">
          <div id="meter-fill"></div>
          <div id="meter-threshold"></div>
        </div>
        <div class="only-vanish meter" title="High-frequency mic level (snaps). The tick is the snap threshold.">
          <div id="snap-fill"></div>
          <div id="snap-threshold"></div>
        </div>

        <div class="hud-row">
          <span id="mic-status">Mic off</span>
          <button id="calibrate-btn" class="ghost" type="button">Calibrate</button>
        </div>
        <div class="hud-row"><span id="hand-status">Hand: off</span></div>

        <div class="only-vanish hud-row">
          <span id="background-status">No background yet</span>
          <button id="capture-btn" class="ghost" type="button">Capture <kbd>B</kbd></button>
        </div>
        <canvas id="background-thumb" class="only-vanish thumb hidden" width="160" height="90"></canvas>
        <div class="only-vanish hud-row"><span id="invisible-status">Invisible: off</span></div>

        <details class="tuning">
          <summary>Tuning</summary>
          <label class="only-fog hud-row">
            <span>Blow sensitivity</span>
            <input id="sensitivity" type="range" min="0" max="100" value="50" />
          </label>
          <label class="only-vanish hud-row">
            <span>Snap sensitivity</span>
            <input id="snap-sensitivity" type="range" min="0" max="100" value="50" />
          </label>
          <label class="only-vanish hud-row">
            <span>Snap needs hand</span>
            <input id="snap-needs-hand" type="checkbox" checked />
          </label>
          <label class="only-vanish hud-row" title="Slide left to grow the cut-out, right to shrink it">
            <span>Mask edge</span>
            <input id="mask-edge" type="range" min="-100" max="100" value="0" />
          </label>
          <label class="only-vanish hud-row">
            <span>Vanish strength</span>
            <input id="vanish-strength" type="range" min="30" max="100" value="100" />
          </label>
        </details>

        <p class="hud-foot"><kbd>H</kbd> hide UI &middot; <kbd>F</kbd> fog &middot; <kbd>C</kbd> clear &middot; <kbd>Space</kbd> vanish &middot; <kbd>D</kbd> mask view</p>
      </aside>
      <div id="countdown" class="countdown">
        <div id="countdown-number"></div>
        <p>Step out of the frame</p>
      </div>
      <div id="hint" class="hint"></div>
      <div id="toast" class="toast"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
